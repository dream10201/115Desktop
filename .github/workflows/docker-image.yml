name: build

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 10 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Fetch latest version
        id: fetch-url
        run: |
          VERSION=$(curl -s https://appversion.115.com/1/web/1.0/api/getMultiVer | jq -r '.data["115Life_Linux"].version_code')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          LAST_VERSION=$(cat .github/version 2>/dev/null || true)
          if [ "$VERSION" = "$LAST_VERSION" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Save version
        if: steps.fetch-url.outputs.skip == 'false'
        run: |
          echo "${{ steps.fetch-url.outputs.version }}" > .github/version
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/version
            git commit -m "Update version to ${{ steps.fetch-url.outputs.version }}"
            git push
          fi
      - name: Set up Docker Buildx
        if: steps.fetch-url.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        if: steps.fetch-url.outputs.skip == 'false'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        if: steps.fetch-url.outputs.skip == 'false'
        uses: docker/build-push-action@v7
        with:
          push: true
          build-args: |
            VERSION=${{ steps.fetch-url.outputs.version }}
          tags: |
            ghcr.io/dream10201/115desktop:latest
            ghcr.io/dream10201/115desktop:${{ steps.fetch-url.outputs.version }}
